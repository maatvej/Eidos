# filename: .github/workflows/deploy.yml
name: Enterprise CI/CD Production Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    name: Quality Checks & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Tooling Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov bandit

      - name: Ruff Code Formatting & Linting Check
        run: ruff check app tests

      - name: Strict MyPy Type Safety Check
        run: mypy --strict app

      - name: Security Vulnerability Scan (Bandit)
        run: bandit -r app -x tests

  test-suite:
    name: Automated Async Test Suite
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Platform Dependencies
        run: pip install .[dev]

      - name: Execute Pytest Suite with Coverage Threshold
        run: pytest --cov=app --cov-fail-under=85 tests/

  build-and-deploy:
    name: Container Build & Kubernetes Rollout
    runs-on: ubuntu-latest
    needs: test-suite
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Enterprise Registry
        uses: docker/login-action@v3
        with:
          registry: enterprise.cr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push GPU Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: enterprise.cr.io/conversation-ai:${{ github.sha }}, enterprise.cr.io/conversation-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Kubeconfig Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Rolling Upgrade Kubernetes Deployments
        run: |
          kubectl set image deployment/api-server api=enterprise.cr.io/conversation-ai:${{ github.sha }} -n conversation-ai
          kubectl set image deployment/gpu-worker worker=enterprise.cr.io/conversation-ai:${{ github.sha }} -n conversation-ai
          kubectl rollout status deployment/api-server -n conversation-ai --timeout=300s
