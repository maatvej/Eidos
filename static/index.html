<!-- filename: static/index.html -->
<!doctype html>
<html lang="ru" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Eidos Voice Intelligence - Премиальная расшифровка аудиозаписей встреч с диаризацией спикеров и ИИ-аналитикой."
    />
    <title>Eidos | Voice Intelligence & Executive Analytics</title>

    <!-- FOUC (Flash of Unstyled Content) Prevention Script -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("eidos_theme");
          var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Tailwind CSS CDN & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ['class', '[data-theme="dark"]'],
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'system-ui', 'sans-serif'],
              display: ['Unbounded', 'Manrope', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                200: '#c7d2fe',
                300: '#a5b4fc',
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                800: '#3730a3',
                900: '#312e81',
              }
            }
          }
        }
      };
    </script>

    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Top Navigation & Brand Header -->
      <header class="app-header" role="banner">
        <a
          href="/"
          data-link
          class="brand-wrapper"
          style="text-decoration: none; color: inherit; cursor: pointer;"
          aria-label="Eidos Voice Intelligence — Главная страница (загрузка аудио)"
        >
          <div class="brand-logo-icon" aria-hidden="true">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"
              ></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </div>
          <div class="brand-text">
            <div class="brand-title-row">
              <h1 class="brand-title-text">Eidos Voice Intelligence</h1>
              <span class="header-status-badge">
                <span class="pulse-dot" aria-hidden="true"></span>
                v1.0 Ready
              </span>
            </div>
            <p class="brand-subtitle">
              Интеллектуальная транскрипция, диаризация спикеров и
              исполнительная аналитика встреч
            </p>
          </div>
        </a>

        <div class="header-actions">
          <!-- View Switcher Toggle -->
          <a
            href="/account"
            data-link
            id="viewToggleBtn"
            class="icon-button"
            role="button"
            aria-label="Переключить в Личный кабинет"
            aria-pressed="false"
            title="Переключить между Студией и Личным кабинетом"
            style="
              background: var(--primary-light);
              border-color: rgba(99, 102, 241, 0.3);
              color: var(--primary);
              text-decoration: none;
            "
          >
            <svg
              id="viewToggleIcon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span id="viewToggleText">Личный кабинет</span>
          </a>

          <!-- User Profile Widget -->
          <div id="userProfileContainer" class="user-profile-badge">
            <div class="user-avatar-icon" aria-hidden="true">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <span id="userDisplayName" class="user-name-text">...</span>
            <a
              id="logoutBtn"
              href="/accounts/logout/"
              class="logout-link-btn"
              title="Выйти из учетной записи"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Выход</span>
            </a>
          </div>

          <!-- Theme Toggle -->
          <button
            id="themeToggleBtn"
            class="icon-button"
            type="button"
            aria-label="Переключить тему оформления"
            aria-pressed="false"
            title="Переключить тему оформления"
          >
            <span id="themeIconSlot" style="display:inline-flex; align-items:center; justify-content:center;">
              <svg
                id="themeIcon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
            </span>
          </button>
        </div>
      </header>

      <!-- Main Workspace Grid (Studio View) -->
      <main class="workspace-grid" id="studioWorkspace" role="main">
        <!-- Sidebar Panel: Upload & Audio Processing -->
        <aside class="sidebar-panel" aria-label="Панель загрузки файлов">
          <file-upload-dropzone></file-upload-dropzone>
        </aside>

        <!-- Main Content Area: Executive Summary & Transcript Player -->
        <section
          class="main-content-panel"
          aria-label="Панель результатов транскрипции и аналитики"
        >
          <executive-intelligence-card></executive-intelligence-card>
          <transcript-player></transcript-player>
        </section>
      </main>

      <!-- Account Management & History Panel (Account View) -->
      <section
        class="account-workspace"
        id="accountWorkspace"
        style="display: none; padding: 20px 0"
        aria-label="Раздел управления аккаунтом и истории транскрипций"
      >
        <account-management></account-management>
      </section>
    </div>

    <!-- Toast Notifications Root -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
