# filename: pyproject.toml
[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eidos"
version = "1.0.0"
description = "Enterprise AI Conversation Intelligence & Audio Transcription Platform"
authors = [{ name = "Lead Architect", email = "architect@enterprise.ai" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "django>=5.0.0",
    "django-allauth>=65.0.0",
    "pyjwt>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "arq>=0.25.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "reportlab>=4.1.0",
    "python-docx>=1.1.0",
    "faster-whisper>=1.0.0",
    "pyannote.audio>=3.1.1",
    "torch>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.9.6",
    "pre-commit>=3.6.0",
    "uv>=0.5.0"
]

# Explicit package discovery rule telling setuptools to only package the app directory
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
src = [".", "app"]
include = ["*.py", "*.pyi", "**/pyproject.toml"]
exclude = [
    ".git",
    ".git-rewrite",
    ".ruff_cache",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "local_storage",
    "django_static",
    "static",
    "templates",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # Pyflakes
    "C90",     # McCabe cyclomatic complexity
    "I",       # isort (import sorting)
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "YTT",     # flake8-2020
    "ASYNC",   # flake8-async
    "S",       # flake8-bandit (security)
    "BLE",     # flake8-blind-except
    "B",       # flake8-bugbear
    "A",       # flake8-builtins
    "C4",      # flake8-comprehensions
    "DTZ",     # flake8-datetimez
    "T10",     # flake8-debugger
    "DJ",      # flake8-django
    "EXE",     # flake8-executable
    "FA",      # flake8-future-annotations
    "ISC",     # flake8-implicit-str-concat
    "ICN",     # flake8-import-conventions
    "LOG",     # flake8-logging
    "G",       # flake8-logging-format
    "PIE",     # flake8-pie
    "T20",     # flake8-print
    "PT",      # flake8-pytest-style
    "Q",       # flake8-quotes
    "RSE",     # flake8-raise
    "RET",     # flake8-return
    "SLF",     # flake8-self
    "SIM",     # flake8-simplify
    "TID",     # flake8-tidy-imports
    "INT",     # flake8-gettext
    "FLY",     # flynt
    "PERF",    # Perflint
    "FAST",    # FastAPI
    "RUF",     # Ruff-specific rules
    "PGH",     # pygrep-hooks
    "PL",      # Pylint
]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "ISC001",  # Conflicts with formatter
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison
    "SIM105",  # Use contextlib.suppress
    "RUF001",  # Ambiguous Cyrillic characters in strings (needed for Russian language domain)
    "RUF002",  # Ambiguous Cyrillic characters in docstrings
    "RUF003",  # Ambiguous Cyrillic characters in comments
    "RUF012",  # Mutable class attributes (Django Model Meta & Arq WorkerSettings)
    "A005",    # Module shadows standard library module (e.g. app/core/logging.py)
    "FAST001", # Redundant response_model argument
    "FAST002", # FastAPI dependency without Annotated
    "DJ001",   # Avoid using null=True on string-based fields (used intentionally in models)
    "S105",    # Possible hardcoded password in variable name (token_type, PYANNOTE_AUTH_TOKEN)
    "S106",    # Possible hardcoded password in function argument
    "BLE001",  # Blind exception catching in background workers / middleware error boundaries
    "PLC0415", # Imports outside top level (lazy loading of optional/heavy modules)
    "N806",    # Uppercase variable name (e.g. User = get_user_model())
    "B904",    # Within an `except` clause, raise exceptions with `raise ... from`
]
fixable = ["ALL"]
unfixable = [
    "F401",    # Unused imports should not be automatically removed
    "F841",    # Unused variables
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
    "fastapi.File",
    "Depends",
    "Query",
    "Path",
    "Body",
    "Header",
    "Security",
    "File",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "S101",    # Use of assert in tests
    "S105",    # Hardcoded passwords in tests
    "S106",    # Hardcoded passwords in test fixtures
    "S108",    # Temporary files in tests
    "SLF001",  # Private member access in tests
    "PLR2004", # Magic numbers in tests
    "PT011",   # pytest.raises too broad
    "PT004",   # pytest fixture without return value
    "PT012",   # pytest.raises with multiple statements
    "DTZ001",  # Naive datetime in tests
    "DTZ005",  # datetime.now without tz in tests
    "N806",    # User = get_user_model() in tests
    "PLC0415", # Lazy imports in tests
    "F841",    # Unused variables in tests
    "SIM117",  # Nested with statements in tests
]
"alembic/**/*" = [
    "INP001",
    "E402",
]
"app/db/migrations/**/*" = [
    "E501",
    "N806",
    "RUF012",
]
"manage.py" = [
    "INP001",
    "T201",
    "PLC0415",
]
"run_local.py" = [
    "T201",
    "S603",
    "S607",
    "BLE001",
    "PLC0415",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_subclassing_any = false
exclude = [
    "app/db/migrations/.*",
    "alembic/.*",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "django_db: mark test as requiring Django database access",
]

[tool.coverage.run]
omit = [
    "app/db/migrations/*",
]
