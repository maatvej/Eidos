# filename: pyproject.toml
[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-intelligence"
version = "1.0.0"
description = "Enterprise AI Conversation Intelligence & Audio Transcription Platform"
authors = [{ name = "Lead Architect", email = "architect@enterprise.ai" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "django>=5.0.0",
    "django-allauth>=65.0.0",
    "pyjwt>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "arq>=0.25.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "reportlab>=4.1.0",
    "python-docx>=1.1.0",
    "faster-whisper>=1.0.0",
    "pyannote.audio>=3.1.1",
    "torch>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0"
]

# Explicit package discovery rule telling setuptools to only package the app directory
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "S", "A"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "django_db: mark test as requiring Django database access",
]

[tool.coverage.run]
omit = [
    "app/db/migrations/*",
]